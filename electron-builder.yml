appId: com.retailpos.app
productName: RetailPOS
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
win:
  executableName: RetailPOS
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: RetailPOS-${version}-setup.${ext}
  shortcutName: RetailPOS
  uninstallDisplayName: RetailPOS
  createDesktopShortcut: always
  createStartMenuShortcut: true
linux:
  target:
    - AppImage
    - deb
  maintainer: mrshahbazdev
  category: Office
appImage:
  artifactName: RetailPOS-${version}.${ext}
npmRebuild: true
publish:
  provider: generic
  url: https://example.com/auto-updates
